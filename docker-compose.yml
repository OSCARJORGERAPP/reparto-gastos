version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: reparto-gastos-db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: reparto-gastos
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - reparto-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
    driver: local

networks:
  reparto-network:
    driver: bridge
